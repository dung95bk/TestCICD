name: Flutter CI DEMO

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test-main-code:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          architecture: arm64
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-pub --no-current-package lib

  test-android-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
      - name: Test Android integration
        run: flutter build apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: ✅ Notify success (Android)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ Android APK built successfully for *${{ github.repository }}* on branch `${{ github.ref_name }}`"
      - name: ❌ Notify failure (Android)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Android build failed for *${{ github.repository }}* on branch `${{ github.ref_name }}`"

  deploy-to-firebase:
    needs: test-android-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          groups: testers
          file: app/app-release.apk

      - name: ✅ Notify success (Firebase upload)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ APK deployed to Firebase App Distribution for *${{ github.repository }}* on branch `${{ github.ref_name }}`"
      - name: ❌ Notify failure (Firebase upload)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Firebase upload failed for *${{ github.repository }}* on branch `${{ github.ref_name }}`"
  deploy-to-deploygate:
    needs: test-android-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app

      - name: Upload APK to DeployGate
        run: |
          curl -X POST https://deploygate.com/api/users/${{ secrets.DEPLOYGATE_USER_NAME }}/apps \
            -H "Authorization: token ${{ secrets.DEPLOYGATE_API_KEY }}" \
            -F "file=@app/app-release.apk" \
            -F "message=🚀 Uploaded from GitHub Actions CI (${GITHUB_REPOSITORY})"

      - name: ✅ Notify success (DeployGate upload)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ APK uploaded to *DeployGate* for *${{ github.repository }}* on branch `${{ github.ref_name }}`"

      - name: ❌ Notify failure (DeployGate upload)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ DeployGate upload failed for *${{ github.repository }}* on branch `${{ github.ref_name }}`"
  test-ios-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          architecture: arm64
      - name: Clean
        run: flutter clean
      - name: Flutter pub get
        run: flutter pub get
      - name: CocoaPods update
        working-directory: ios
        run: pod repo update
      - name: Test iOS integration
        run: flutter build ios --debug --simulator --no-codesign
      - name: ✅ Notify success (iOS)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ iOS build (simulator) completed successfully for *${{ github.repository }}* on branch `${{ github.ref_name }}`"
      - name: ❌ Notify failure (iOS)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ iOS build (simulator) failed for *${{ github.repository }}* on branch `${{ github.ref_name }}`"
