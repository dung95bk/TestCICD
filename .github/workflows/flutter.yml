name: Flutter CI DEMO

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test-main-code:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          architecture: arm64
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-pub --no-current-package lib

  test-android-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
      - name: Test Android integration
        run: flutter build apk

  test-ios-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          architecture: arm64 
      - name: Clean
        run: flutter clean
      - name: Flutter pub get
        run: flutter pub get
      - name: CocoaPods update
        working-directory: ios
        run: pod repo update
      - name: Test iOS integration
        run: flutter build ios --debug --simulator --no-codesign
